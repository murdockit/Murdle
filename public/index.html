<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Murdle - Logic Puzzle Grid</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: #f5f0e8;
      color: #1a1a1a;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #1a1a1a;
      color: #f5f0e8;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-size: 28px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    header h1 span { color: #c0392b; }
    .btn {
      padding: 10px 20px;
      border: 2px solid #f5f0e8;
      background: transparent;
      color: #f5f0e8;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn:hover { background: #f5f0e8; color: #1a1a1a; }
    .btn-primary {
      border-color: #c0392b;
      background: #c0392b;
    }
    .btn-primary:hover { background: #e74c3c; border-color: #e74c3c; }

    /* ── Main Layout ── */
    .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

    /* ── Mystery List View ── */
    #list-view .mystery-card {
      background: #fff;
      border: 2px solid #1a1a1a;
      padding: 20px 24px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #list-view .mystery-card:hover { background: #faf7f0; transform: translateX(4px); }
    .mystery-card h3 { font-size: 18px; }
    .mystery-card .meta {
      font-size: 13px; color: #666; margin-top: 4px;
    }
    .mystery-card .actions { display: flex; gap: 8px; }
    .mystery-card .actions button {
      padding: 6px 14px;
      border: 1px solid #1a1a1a;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .mystery-card .actions .delete-btn { border-color: #c0392b; color: #c0392b; }
    .mystery-card .actions .delete-btn:hover { background: #c0392b; color: #fff; }
    .mystery-card .actions .open-btn:hover { background: #1a1a1a; color: #fff; }
    .empty-state {
      text-align: center; padding: 80px 20px; color: #888;
    }
    .empty-state h2 { font-size: 24px; margin-bottom: 12px; color: #555; }

    /* ── Create View ── */
    #create-view, #puzzle-view { display: none; }
    .form-section { margin-bottom: 28px; }
    .form-section label {
      display: block; font-weight: bold; margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 1px; font-size: 13px;
    }
    .form-section input,
    .form-section textarea {
      width: 100%; padding: 12px; border: 2px solid #1a1a1a;
      font-family: inherit; font-size: 15px; background: #fff;
    }
    .form-section textarea { min-height: 120px; resize: vertical; }

    .category-builder {
      background: #fff; border: 2px solid #1a1a1a; padding: 20px;
      margin-bottom: 20px;
    }
    .category-builder h3 {
      font-size: 15px; text-transform: uppercase; letter-spacing: 2px;
      margin-bottom: 12px; border-bottom: 2px solid #1a1a1a; padding-bottom: 8px;
    }
    .items-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .items-list .tag {
      background: #1a1a1a; color: #f5f0e8; padding: 6px 12px;
      font-family: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px;
    }
    .tag .remove-tag {
      cursor: pointer; font-size: 16px; line-height: 1; opacity: 0.7;
    }
    .tag .remove-tag:hover { opacity: 1; }
    .add-item-row { display: flex; gap: 8px; }
    .add-item-row input {
      flex: 1; padding: 8px 12px; border: 1px solid #999;
      font-family: inherit; font-size: 14px;
    }
    .add-item-row button {
      padding: 8px 16px; background: #1a1a1a; color: #f5f0e8;
      border: none; cursor: pointer; font-family: inherit;
      font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
    }

    .form-actions {
      display: flex; gap: 12px; margin-top: 32px;
    }
    .form-actions .btn {
      color: #1a1a1a; border-color: #1a1a1a;
    }
    .form-actions .btn:hover { background: #1a1a1a; color: #f5f0e8; }
    .form-actions .btn-primary { color: #f5f0e8; }
    .form-actions .btn-primary:hover { background: #e74c3c; }

    /* ── Puzzle View ── */
    .puzzle-header {
      margin-bottom: 24px;
    }
    .puzzle-header h2 {
      font-size: 24px; margin-bottom: 8px;
    }
    .puzzle-description {
      background: #fff; border: 2px solid #1a1a1a;
      padding: 16px 20px; margin-bottom: 28px;
      font-size: 15px; line-height: 1.6;
      white-space: pre-wrap;
    }

    /* ── Logic Grid ── */
    .grid-container {
      display: inline-block;
      border: 3px solid #1a1a1a;
      background: #fff;
      position: relative;
    }

    .grid-table {
      border-collapse: collapse;
    }
    .grid-table td,
    .grid-table th {
      width: 48px; height: 48px;
      border: 1px solid #1a1a1a;
      text-align: center; vertical-align: middle;
      font-size: 13px; padding: 2px;
      position: relative;
    }

    /* Header cells */
    .grid-table .col-header {
      font-weight: bold; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px;
      height: 64px; width: 48px;
      background: #f5f0e8; border: 1px solid #1a1a1a;
    }
    .col-header .rotated {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
      font-size: 11px;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .grid-table .row-header {
      font-weight: bold; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px;
      text-align: right; padding-right: 8px;
      width: 110px; background: #f5f0e8;
      border: 1px solid #1a1a1a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Category label cells */
    .grid-table .category-label {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-weight: bold;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: #e8e0d0;
      border: 2px solid #1a1a1a;
      width: 32px;
      padding: 8px 2px;
      white-space: nowrap;
    }
    .grid-table .category-col-label {
      font-weight: bold;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: #e8e0d0;
      border: 2px solid #1a1a1a;
      height: 28px;
    }
    .corner-cell {
      background: #e8e0d0;
      border: 2px solid #1a1a1a;
    }

    /* Section borders: thick borders between category blocks */
    .section-border-right { border-right: 3px solid #1a1a1a !important; }
    .section-border-bottom { border-bottom: 3px solid #1a1a1a !important; }

    /* Clickable grid cells */
    .grid-cell {
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .grid-cell:hover { background: #f0ebe0; }

    .grid-cell .mark {
      font-size: 22px;
      font-weight: bold;
      line-height: 1;
    }
    .grid-cell .mark.x-mark { color: #c0392b; }
    .grid-cell .mark.check-mark { color: #27ae60; }

    /* Blank/disabled cells (lower-left triangle in standard logic grids) */
    .grid-cell.disabled {
      background: #e0dcd4;
      cursor: default;
    }
    .grid-cell.disabled:hover { background: #e0dcd4; }

    /* ── Solution Section ── */
    .solution-section {
      margin-top: 32px;
      padding: 24px;
      background: #fff;
      border: 3px solid #c0392b;
    }
    .solution-section h3 {
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 16px;
      color: #c0392b;
    }
    .solution-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .solution-item label {
      display: block;
      font-weight: bold;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .solution-item select {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #1a1a1a;
      font-family: inherit;
      font-size: 14px;
      background: #fff;
      cursor: pointer;
    }
    .solution-item select:focus {
      outline: none;
      border-color: #c0392b;
    }

    .puzzle-actions { margin-top: 24px; display: flex; gap: 12px; }
    .puzzle-actions .btn { color: #1a1a1a; border-color: #1a1a1a; }
    .puzzle-actions .btn:hover { background: #1a1a1a; color: #f5f0e8; }

    .clear-grid-btn { border-color: #c0392b !important; color: #c0392b !important; }
    .clear-grid-btn:hover { background: #c0392b !important; color: #fff !important; }

    /* Legend */
    .legend {
      margin-top: 16px; font-size: 13px; color: #666;
    }
    .legend span { margin-right: 20px; }
    .legend .x-demo { color: #c0392b; font-weight: bold; }
    .legend .check-demo { color: #27ae60; font-weight: bold; }

    /* Responsive */
    .grid-scroll {
      overflow-x: auto;
      padding-bottom: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>M<span>U</span>RDLE</h1>
    <div id="header-actions">
      <button class="btn btn-primary" id="new-mystery-btn" onclick="showCreateView()">+ New Mystery</button>
    </div>
  </header>

  <div class="container">
    <!-- ═══ List View ═══ -->
    <div id="list-view">
      <div id="mystery-list"></div>
    </div>

    <!-- ═══ Create View ═══ -->
    <div id="create-view">
      <h2 style="margin-bottom: 24px;">Create a New Mystery</h2>

      <div class="form-section">
        <label for="mystery-title">Title</label>
        <input type="text" id="mystery-title" placeholder="The Case of the Missing Monocle">
      </div>

      <div class="form-section">
        <label for="mystery-desc">Mystery Information</label>
        <textarea id="mystery-desc" placeholder="Write the backstory, clues, and details of the mystery here..."></textarea>
      </div>

      <div class="category-builder" id="suspects-builder">
        <h3>Suspects</h3>
        <div class="items-list" id="suspects-tags"></div>
        <div class="add-item-row">
          <input type="text" id="suspect-input" placeholder="Add a suspect..." onkeydown="if(event.key==='Enter')addItem('suspects')">
          <button onclick="addItem('suspects')">Add</button>
        </div>
      </div>

      <div class="category-builder" id="weapons-builder">
        <h3>Weapons</h3>
        <div class="items-list" id="weapons-tags"></div>
        <div class="add-item-row">
          <input type="text" id="weapon-input" placeholder="Add a weapon..." onkeydown="if(event.key==='Enter')addItem('weapons')">
          <button onclick="addItem('weapons')">Add</button>
        </div>
      </div>

      <div class="category-builder" id="locations-builder">
        <h3>Locations</h3>
        <div class="items-list" id="locations-tags"></div>
        <div class="add-item-row">
          <input type="text" id="location-input" placeholder="Add a location..." onkeydown="if(event.key==='Enter')addItem('locations')">
          <button onclick="addItem('locations')">Add</button>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn" onclick="showListView()">Cancel</button>
        <button class="btn btn-primary" onclick="createMystery()">Create Mystery</button>
      </div>
    </div>

    <!-- ═══ Puzzle View ═══ -->
    <div id="puzzle-view">
      <div class="puzzle-header">
        <h2 id="puzzle-title"></h2>
      </div>
      <div class="puzzle-description" id="puzzle-desc"></div>

      <div class="grid-scroll">
        <div class="grid-container">
          <table class="grid-table" id="logic-grid"></table>
        </div>
      </div>

      <div class="legend">
        <span>Click to cycle: empty → <span class="x-demo">✕</span> → <span class="check-demo">✓</span> → empty</span>
      </div>

      <div class="solution-section">
        <h3>Your Solution</h3>
        <div class="solution-grid">
          <div class="solution-item">
            <label for="solution-suspect">Suspect</label>
            <select id="solution-suspect" onchange="saveSolution()">
              <option value="">Select suspect...</option>
            </select>
          </div>
          <div class="solution-item">
            <label for="solution-weapon">Weapon</label>
            <select id="solution-weapon" onchange="saveSolution()">
              <option value="">Select weapon...</option>
            </select>
          </div>
          <div class="solution-item">
            <label for="solution-location">Location</label>
            <select id="solution-location" onchange="saveSolution()">
              <option value="">Select location...</option>
            </select>
          </div>
        </div>
      </div>

      <div class="puzzle-actions">
        <button class="btn" onclick="showListView()">← Back to Mysteries</button>
        <button class="btn clear-grid-btn" onclick="clearGrid()">Clear Grid</button>
      </div>
    </div>
  </div>

  <script>
    // ─── State ───
    let currentMystery = null;
    const formItems = { suspects: [], weapons: [], locations: [] };

    // ─── Navigation ───
    function showListView() {
      document.getElementById('list-view').style.display = 'block';
      document.getElementById('create-view').style.display = 'none';
      document.getElementById('puzzle-view').style.display = 'none';
      document.getElementById('new-mystery-btn').style.display = '';
      currentMystery = null;
      loadMysteries();
    }

    function showCreateView() {
      document.getElementById('list-view').style.display = 'none';
      document.getElementById('create-view').style.display = 'block';
      document.getElementById('puzzle-view').style.display = 'none';
      document.getElementById('new-mystery-btn').style.display = 'none';
      // Reset form
      document.getElementById('mystery-title').value = '';
      document.getElementById('mystery-desc').value = '';
      formItems.suspects = [];
      formItems.weapons = [];
      formItems.locations = [];
      renderTags('suspects');
      renderTags('weapons');
      renderTags('locations');
    }

    function showPuzzleView(mystery) {
      currentMystery = mystery;
      document.getElementById('list-view').style.display = 'none';
      document.getElementById('create-view').style.display = 'none';
      document.getElementById('puzzle-view').style.display = 'block';
      document.getElementById('new-mystery-btn').style.display = 'none';
      document.getElementById('puzzle-title').textContent = mystery.title;
      const descEl = document.getElementById('puzzle-desc');
      if (mystery.description) {
        descEl.textContent = mystery.description;
        descEl.style.display = '';
      } else {
        descEl.style.display = 'none';
      }
      buildGrid();
      populateSolutionDropdowns();
    }

    // ─── Tag Management ───
    function addItem(category) {
      const inputMap = { suspects: 'suspect-input', weapons: 'weapon-input', locations: 'location-input' };
      const input = document.getElementById(inputMap[category]);
      const val = input.value.trim();
      if (!val) return;
      if (formItems[category].includes(val)) return;
      formItems[category].push(val);
      input.value = '';
      renderTags(category);
      input.focus();
    }

    function removeItem(category, index) {
      formItems[category].splice(index, 1);
      renderTags(category);
    }

    function renderTags(category) {
      const tagMap = { suspects: 'suspects-tags', weapons: 'weapons-tags', locations: 'locations-tags' };
      const container = document.getElementById(tagMap[category]);
      container.innerHTML = formItems[category].map((item, i) =>
        `<span class="tag">${esc(item)}<span class="remove-tag" onclick="removeItem('${category}',${i})">×</span></span>`
      ).join('');
    }

    // ─── API ───
    async function loadMysteries() {
      const res = await fetch('/api/mysteries');
      const mysteries = await res.json();
      const list = document.getElementById('mystery-list');
      if (mysteries.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <h2>No Mysteries Yet</h2>
            <p>Create your first logic puzzle to get started.</p>
          </div>`;
        return;
      }
      list.innerHTML = mysteries.map(m => `
        <div class="mystery-card">
          <div>
            <h3>${esc(m.title)}</h3>
            <div class="meta">${m.suspects.length} suspects · ${m.weapons.length} weapons · ${m.locations.length} locations</div>
          </div>
          <div class="actions">
            <button class="open-btn" onclick="event.stopPropagation(); openMystery(${m.id})">Open</button>
            <button class="delete-btn" onclick="event.stopPropagation(); deleteMystery(${m.id})">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function openMystery(id) {
      const res = await fetch(`/api/mysteries/${id}`);
      const mystery = await res.json();
      showPuzzleView(mystery);
    }

    async function deleteMystery(id) {
      if (!confirm('Delete this mystery?')) return;
      await fetch(`/api/mysteries/${id}`, { method: 'DELETE' });
      loadMysteries();
    }

    async function createMystery() {
      const title = document.getElementById('mystery-title').value.trim();
      const description = document.getElementById('mystery-desc').value.trim();
      if (!title) return alert('Please enter a title.');
      if (formItems.suspects.length < 2) return alert('Add at least 2 suspects.');
      if (formItems.weapons.length < 2) return alert('Add at least 2 weapons.');
      if (formItems.locations.length < 2) return alert('Add at least 2 locations.');

      const res = await fetch('/api/mysteries', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title,
          description,
          suspects: [...formItems.suspects],
          weapons: [...formItems.weapons],
          locations: [...formItems.locations]
        })
      });
      const mystery = await res.json();
      showPuzzleView(mystery);
    }

    async function saveGrid() {
      if (!currentMystery) return;
      await fetch(`/api/mysteries/${currentMystery.id}/grid`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ grid: currentMystery.grid })
      });
    }

    function clearGrid() {
      if (!currentMystery) return;
      if (!confirm('Clear all marks from the grid?')) return;
      currentMystery.grid = {};
      saveGrid();
      buildGrid();
    }

    // ─── Solution Management ───
    function populateSolutionDropdowns() {
      if (!currentMystery) return;

      // Populate suspects dropdown
      const suspectSelect = document.getElementById('solution-suspect');
      suspectSelect.innerHTML = '<option value="">Select suspect...</option>' +
        currentMystery.suspects.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');

      // Populate weapons dropdown
      const weaponSelect = document.getElementById('solution-weapon');
      weaponSelect.innerHTML = '<option value="">Select weapon...</option>' +
        currentMystery.weapons.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join('');

      // Populate locations dropdown
      const locationSelect = document.getElementById('solution-location');
      locationSelect.innerHTML = '<option value="">Select location...</option>' +
        currentMystery.locations.map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join('');

      // Set current values if solution exists
      const solution = currentMystery.solution || {};
      if (solution.suspect) suspectSelect.value = solution.suspect;
      if (solution.weapon) weaponSelect.value = solution.weapon;
      if (solution.location) locationSelect.value = solution.location;
    }

    async function saveSolution() {
      if (!currentMystery) return;

      const solution = {
        suspect: document.getElementById('solution-suspect').value || null,
        weapon: document.getElementById('solution-weapon').value || null,
        location: document.getElementById('solution-location').value || null
      };

      currentMystery.solution = solution;

      await fetch(`/api/mysteries/${currentMystery.id}/solution`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ solution })
      });
    }

    // ─── Grid Builder ───
    // The Murdle grid layout (matching the book image):
    //
    // Columns are: SUSPECTS (top) | LOCATIONS (top)
    // Rows are: WEAPONS (left) | LOCATIONS (left)
    //
    // This creates the classic L-shaped grid:
    //   - WEAPONS vs SUSPECTS (top-left block)
    //   - WEAPONS vs LOCATIONS (top-right block)
    //   - LOCATIONS vs SUSPECTS (bottom-left block)
    //   - LOCATIONS vs LOCATIONS (bottom-right, disabled/blank diagonal)

    function buildGrid() {
      const m = currentMystery;
      const suspects = m.suspects;
      const weapons = m.weapons;
      const locations = m.locations;

      const colGroups = [
        { label: 'Suspects', items: suspects },
        { label: 'Locations', items: locations }
      ];
      const rowGroups = [
        { label: 'Weapons', items: weapons },
        { label: 'Locations', items: locations }
      ];

      const totalCols = suspects.length + locations.length;
      const totalRows = weapons.length + locations.length;

      const table = document.getElementById('logic-grid');
      let html = '';

      // ── Column category labels row ──
      html += '<tr>';
      html += '<td class="corner-cell" colspan="2" rowspan="2"></td>'; // empty corner
      for (let g = 0; g < colGroups.length; g++) {
        const grp = colGroups[g];
        const isLast = g === colGroups.length - 1;
        html += `<td class="category-col-label${isLast ? '' : ' section-border-right'}" colspan="${grp.items.length}">${esc(grp.label)}</td>`;
      }
      html += '</tr>';

      // ── Column item headers row ──
      html += '<tr>';
      let colIdx = 0;
      for (let g = 0; g < colGroups.length; g++) {
        const grp = colGroups[g];
        for (let c = 0; c < grp.items.length; c++) {
          const isGroupEnd = c === grp.items.length - 1 && g < colGroups.length - 1;
          html += `<th class="col-header${isGroupEnd ? ' section-border-right' : ''}"><div class="rotated">${esc(grp.items[c])}</div></th>`;
          colIdx++;
        }
      }
      html += '</tr>';

      // ── Data rows ──
      let rowIdx = 0;
      for (let rg = 0; rg < rowGroups.length; rg++) {
        const rGrp = rowGroups[rg];
        for (let r = 0; r < rGrp.items.length; r++) {
          html += '<tr>';

          // Row category label (only on first row of group)
          if (r === 0) {
            html += `<td class="category-label" rowspan="${rGrp.items.length}">${esc(rGrp.label)}</td>`;
          }

          // Row item label
          const isGroupEndRow = r === rGrp.items.length - 1 && rg < rowGroups.length - 1;
          html += `<td class="row-header${isGroupEndRow ? ' section-border-bottom' : ''}">${esc(rGrp.items[r])}</td>`;

          // Grid cells
          let colIdx2 = 0;
          for (let cg = 0; cg < colGroups.length; cg++) {
            const cGrp = colGroups[cg];
            for (let c = 0; c < cGrp.items.length; c++) {
              const isColGroupEnd = c === cGrp.items.length - 1 && cg < colGroups.length - 1;
              const key = `${rowIdx}-${colIdx2}`;

              // Determine if this is a disabled cell (locations vs locations diagonal)
              const isLocRow = rg === 1;
              const isLocCol = cg === 1;
              let disabled = false;
              if (isLocRow && isLocCol) {
                // In the locations-vs-locations block, disable the diagonal and below
                if (r >= c) disabled = true;
              }

              let classes = 'grid-cell';
              if (disabled) classes += ' disabled';
              if (isColGroupEnd) classes += ' section-border-right';
              if (isGroupEndRow) classes += ' section-border-bottom';

              const val = m.grid[key] || '';
              let content = '';
              if (val === 'x') content = '<span class="mark x-mark">✕</span>';
              else if (val === 'check') content = '<span class="mark check-mark">✓</span>';

              if (disabled) {
                html += `<td class="${classes}"></td>`;
              } else {
                html += `<td class="${classes}" onclick="toggleCell('${key}')">${content}</td>`;
              }
              colIdx2++;
            }
          }
          html += '</tr>';
          rowIdx++;
        }
      }

      table.innerHTML = html;
    }

    function toggleCell(key) {
      if (!currentMystery) return;
      const current = currentMystery.grid[key] || '';
      if (current === '') currentMystery.grid[key] = 'x';
      else if (current === 'x') currentMystery.grid[key] = 'check';
      else currentMystery.grid[key] = '';
      saveGrid();
      buildGrid();
    }

    // ─── Util ───
    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // ─── Init ───
    loadMysteries();
  </script>
</body>
</html>
